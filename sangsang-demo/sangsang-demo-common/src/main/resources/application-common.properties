# mysql
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
# 提供的演示数据库中数据库已经提前初始化好了，如果想要使用自己本地数据库调试的话，初始化脚本位于sangsang-demo-common模块的resources/sql/下
spring.datasource.url=jdbc:mysql://43.130.242.215:3307/sangsang?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
spring.datasource.username=sangsang
spring.datasource.password=sangsang
#=======================================================================================================================
#mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
#=======================================================================================================================
# Thymeleaf前端配置
spring.thymeleaf.check-template-location=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
#=======================================================================================================================
spring.profiles.active=dev
